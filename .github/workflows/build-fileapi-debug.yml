name: Build APKs

on:
  workflow_dispatch:
  push:
    branches:
      - feat/gemini-file-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "rikkahub-fileapi-build",
              "storage_bucket": "rikkahub-fileapi-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef012345",
                  "android_client_info": { "package_name": "me.rerere.rikkahub" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDUMMYKEYFORPERSONALBUILDONLY00000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef012345",
                  "android_client_info": { "package_name": "me.rerere.rikkahub.debug" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDUMMYKEYFORPERSONALBUILDONLY00000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build native helpers (libsafesdcard.so for PRoot & libshelldrop.so for Sui UID 2000)
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p app/src/main/assets/safesdcard
          aarch64-linux-gnu-gcc -shared -fPIC -O2 workspace/safesdcard/safesdcard.c -o app/src/main/assets/safesdcard/libsafesdcard_arm64.so -ldl
          gcc -shared -fPIC -O2 workspace/safesdcard/safesdcard.c -o app/src/main/assets/safesdcard/libsafesdcard_x86_64.so -ldl
          ls -lh app/src/main/assets/safesdcard

          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -n1)}"
          CLANG_BIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p app/src/github/jniLibs/arm64-v8a app/src/github/jniLibs/x86_64
          "$CLANG_BIN/aarch64-linux-android26-clang" -O2 -fPIE -pie -Wl,-z,max-page-size=16384 app/shelldrop/shelldrop.c -o app/src/github/jniLibs/arm64-v8a/libshelldrop.so
          "$CLANG_BIN/x86_64-linux-android26-clang" -O2 -fPIE -pie -Wl,-z,max-page-size=16384 app/shelldrop/shelldrop.c -o app/src/github/jniLibs/x86_64/libshelldrop.so
          ls -lh app/src/github/jniLibs/arm64-v8a app/src/github/jniLibs/x86_64

      - name: Run unit tests & build release + debug (arm64)
        run: |
          chmod +x gradlew
          ./gradlew :workspace:testDebugUnitTest --no-daemon
          ./gradlew :app:testGithubDebugUnitTest --tests "me.rerere.rikkahub.phoneuse.*" --tests "me.rerere.rikkahub.data.ai.tools.PhoneUseToolTest" --no-daemon
          ./gradlew assembleGithubRelease assembleGithubDebug --no-daemon

      - name: Collect arm64 APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk/github -name "*arm64-v8a*.apk" -exec cp {} out/ \;
          ls -lh out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-apks
          path: out/*.apk
          retention-days: 14
